name: E2E Selenium Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selenium:
    name: Checkout flow (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      E2E_BASE_URL: https://www.saucedemo.com
      E2E_BROWSER: chrome
      E2E_HEADLESS: "true"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Chrome and chromedriver ship pre-installed on ubuntu-latest runners.
      - name: Show Chrome version
        run: |
          google-chrome --version || true
          chromedriver --version || true

      - name: Run Selenium test suite
        run: pytest -v --html=reports/report.html --self-contained-html

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: reports/
          if-no-files-found: warn

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/
          if-no-files-found: ignore
