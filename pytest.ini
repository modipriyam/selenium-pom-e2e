[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --tb=short
    --html=reports/report.html
    --self-contained-html
markers =
    smoke: quick sanity checks that must always pass
    checkout: end-to-end checkout flow scenarios
    login: authentication scenarios
    regression: broader regression coverage
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s | %(levelname)-7s | %(name)s | %(message)s
log_cli_date_format = %H:%M:%S
